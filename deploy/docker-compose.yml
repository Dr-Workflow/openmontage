# HeyJoe Filmmaker — Backlot storyboard server (port 3004 -> 4750)
# Projects dir is a HOST bind mount so productions created on the VPS
# (e.g. by pipeline tools or the simulator) appear in the embedded UI.
services:
  filmmaker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: heyjoe-filmmaker
    restart: unless-stopped
    ports:
      - "3004:4750"
    volumes:
      - /data/OpenMontage/projects:/app/projects
