# HeyJoe Filmmaker — Backlot storyboard server (port 3004 -> 4750)
services:
  filmmaker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: heyjoe-filmmaker
    restart: unless-stopped
    ports:
      - "3004:4750"
    volumes:
      - filmmaker_projects:/app/projects
volumes:
  filmmaker_projects:
